events {
    # Definição de quantas conexões simultâneas cada processo do Nginx pode gerenciar
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    # REGRA DE SEGURANÇA CRUCIAL:
    # Se o cliente externo enviar um "X-Telegram-Id" forjado no cabeçalho, mas a requisição
    # NÃO vier de um IP confiável do seu Bot Bun/Intermediário, limpamos o cabeçalho.
    # (Abordagem opcional: Se o Bun roda na mesma rede/máquina, confie apenas no IP do Bun).

    # Validação do cabeçalho usando MAP (Roda fora do location, evitando bugs de 'if')
    # Se o cabeçalho estiver vazio ou contiver apenas espaços, definimos a variável $bloqueio_acesso como 1
    map $http_x_telegram_id $bloqueio_acesso {
        ""       1;
        "~^\s*$" 1;
        default  0;
    }

    limit_req_zone $binary_remote_addr zone=limite_por_ip:10m rate=5r/s;
    limit_req_zone $http_x_telegram_id zone=limite_por_usuario:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Mapeamento dos códigos de erro para respostas JSON limpas
        error_page 403 @forbidden;
        error_page 429 @rate_limited;

        location / {
            limit_req_status 429;

            # Se a variável mapeada for 1 (cabeçalho ausente/inválido), barra imediatamente.
            # O 'return' dentro do 'if' é seguro e não quebra o comportamento do Nginx.
            if ($bloqueio_acesso) {
                return 403;
            }

            # 2. Rate Limits
            limit_req zone=limite_por_ip burst=5 nodelay;
            limit_req zone=limite_por_usuario burst=2 nodelay;

            # 3. Proxy Configs
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Telegram-Id $http_x_telegram_id;

            proxy_pass http://api:8080;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"timestamp": "$time_iso8601", "status": 403, "error": "Forbidden", "message": "Acesso negado. Cabeçalho X-Telegram-Id ausente."}';
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"timestamp": "$time_iso8601", "status": 429, "error": "Too Many Requests", "message": "Muitas requisições. Por favor, aguarde um momento."}';
        }
    }
}